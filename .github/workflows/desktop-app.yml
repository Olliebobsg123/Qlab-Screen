name: Desktop app

# Builds the QLab Connect app for Mac and Windows. Download the results from the run's
# "Artifacts" section (Actions tab), or from a GitHub Release when a v* tag is pushed.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            command: npx electron-builder --mac --publish never
          - os: windows-latest
            name: windows
            command: npx electron-builder --win --publish never
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        shell: bash
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: QLab-Connect-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
