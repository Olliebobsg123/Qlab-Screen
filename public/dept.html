<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Department Cues</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="dept-body server-offline">
    <main class="shell dept-shell">
      <header class="topbar">
        <div class="topbar-title">
          <span class="eyebrow" id="deptEyebrow">Department</span>
          <h1><span class="dept-dot" id="deptDot"></span><span id="deptName">Loading…</span></h1>
        </div>
        <nav id="deptNav" class="topnav" aria-label="Pages" data-nav></nav>
        <div class="topbar-actions">
          <span class="status-chips">
            <span id="deptShowClock" class="status-chip show-clock" data-state="idle" hidden></span>
            <span id="deptDesk" class="status-chip desk-chip" data-state="off" hidden title="Lighting desk">Desk</span>
            <span id="deptQlab" class="status-chip" data-state="off">QLab</span>
          </span>
          <button id="logoutButton" type="button" class="tool-button">Log out</button>
          <button id="menuButton" type="button" class="tool-button menu-button" aria-expanded="false" aria-controls="deptNav">Menu</button>
        </div>
      </header>

      <p id="deptNotice" class="notice" hidden></p>

      <section class="dept-grid">
        <div class="dept-main">
          <!-- Whole-show controls, for departments with those powers (the Stage Manager has them all) -->
          <section id="showCard" class="panel show-card" hidden>
            <div id="showGoBlock">
              <div class="show-standby">
                <span class="eyebrow">Standby · next GO</span>
                <div class="go-next">
                  <strong class="go-number" id="showNumber">–</strong>
                  <strong class="go-name" id="showName">Waiting for QLab</strong>
                </div>
                <p id="showNotes" class="notes-text" hidden></p>
              </div>
              <button id="showGo" type="button" class="go-button show-go" data-show="go">GO</button>
              <div class="go-steps">
                <button type="button" class="secondary" data-show="previous">◀ Previous</button>
                <button type="button" class="secondary" data-show="next">Next ▶</button>
              </div>
            </div>
            <div id="transportBlock" class="transport-row">
              <button type="button" class="secondary" data-show="pause">Pause all</button>
              <button type="button" class="secondary" data-show="resume">Resume all</button>
              <button type="button" class="secondary" data-show="stop">Stop all</button>
              <button id="panicButton" type="button" class="panic-button">
                <span class="hold-fill" aria-hidden="true"></span>
                <span class="hold-label">Hold for panic</span>
              </button>
              <button id="hardStopButton" type="button" class="danger-outline">Hard stop</button>
            </div>
          </section>

          <!-- This department's own GO (its cue list, or its own cues in show order) -->
          <div id="goCards" class="go-cards"></div>

          <div id="runningPanel" class="panel dept-panel" hidden>
            <div class="panel-head">
              <h2>Running</h2>
              <button id="stopAllButton" type="button" class="danger-outline small-button">Stop all my cues</button>
            </div>
            <div id="deptRunning" class="dept-running empty">Nothing running.</div>
          </div>
        </div>

        <div class="dept-side">
          <nav id="sideTabs" class="tabs side-tabs" role="tablist" aria-label="Sections" hidden>
            <button type="button" role="tab" class="tab" data-side-tab="cues">Cues</button>
            <button type="button" role="tab" class="tab" data-side-tab="standbys">Standbys</button>
            <button type="button" role="tab" class="tab" data-side-tab="calls">Calls</button>
            <button type="button" role="tab" class="tab" data-side-tab="clock">Clock</button>
          </nav>

          <section id="side-cues" class="panel dept-panel dept-cues-panel side-panel">
            <div class="panel-head">
              <h2 id="deptCuesTitle">My cues</h2>
              <span id="deptCueCount">0 cues</span>
            </div>
            <div class="cue-search">
              <input id="cueSearch" type="search" autocomplete="off" placeholder="Find a cue by number or name" aria-label="Find a cue">
            </div>
            <p class="cue-hint quiet">Tap a cue for its options.</p>
            <div id="deptCues" class="dept-cues empty">No cues yet.</div>
          </section>

          <section id="side-standbys" class="panel side-card side-panel" hidden>
            <div class="side-card-head">
              <h2>Standby calls</h2>
              <span class="eyebrow">Standby → they confirm → GO</span>
            </div>
            <div id="lightRows" class="light-rows"></div>
          </section>

          <section id="side-calls" class="panel side-card side-panel" hidden>
            <div class="side-card-head">
              <h2>Backstage calls</h2>
              <span id="pageStatus" class="eyebrow">No active call</span>
            </div>
            <div class="page-presets">
              <button type="button" class="secondary" data-page="Beginners to the stage please">Beginners</button>
              <button type="button" class="secondary" data-page="Places please">Places</button>
              <button type="button" class="secondary" data-page="5 minutes please">5 minutes</button>
              <button type="button" class="secondary" data-page="House is open">House open</button>
              <button type="button" class="secondary" data-page="Interval: 5 minutes remaining">Interval 5</button>
              <button type="button" class="secondary" data-page="Hold please" data-level="urgent">HOLD</button>
            </div>
            <form id="pageForm" class="page-form">
              <label class="wide">
                <span>Message</span>
                <input name="text" maxlength="200" autocomplete="off" placeholder="Type a call…">
              </label>
              <label>
                <span>To</span>
                <select name="target"></select>
              </label>
              <label>
                <span>Style</span>
                <select name="level">
                  <option value="call">Call</option>
                  <option value="info">Info</option>
                  <option value="urgent">Urgent</option>
                </select>
              </label>
              <label>
                <span>Clear after (s)</span>
                <input name="durationSec" type="number" min="0" max="3600" value="60" inputmode="numeric">
              </label>
              <div class="form-actions wide">
                <button type="submit">Send call</button>
                <button type="button" class="secondary" data-show="clearPage">Clear</button>
              </div>
            </form>
          </section>

          <section id="side-clock" class="panel side-card side-panel" hidden>
            <div class="side-card-head">
              <h2>Show clock</h2>
              <span id="clockLabel" class="eyebrow">Not started</span>
            </div>
            <div id="clockValue" class="clock-big" data-state="idle">--:--</div>
            <div class="side-buttons">
              <button type="button" class="secondary" data-show="showStart">Start show</button>
              <button type="button" class="secondary" data-show="showEnd">End show</button>
            </div>
            <div class="interval-row">
              <label>
                <span>Interval (min)</span>
                <input id="intervalMinutes" type="number" min="0" max="180" value="20" inputmode="numeric">
              </label>
              <button id="intervalStartButton" type="button" class="secondary">Start interval</button>
              <button type="button" class="secondary" data-show="intervalEnd">End</button>
            </div>
          </section>
        </div>
      </section>

      <label class="toggle-row dept-keyboard">
        <input id="deptKeyboard" type="checkbox">
        <span>Space bar = GO on this device</span>
      </label>

      <!-- Options for one cue: start, standby, start from a point, pause, skip -->
      <dialog id="cuePanel" class="cue-panel">
        <form method="dialog" class="cue-panel-inner">
          <div class="cue-panel-head">
            <div>
              <span class="eyebrow" id="panelType">Cue</span>
              <h2><span id="panelNumber" class="go-number"></span> <span id="panelName"></span></h2>
            </div>
            <button type="submit" class="tool-button" aria-label="Close">Close</button>
          </div>
          <p id="panelNotes" class="notes-text" hidden></p>

          <div id="panelRunning" class="panel-running" hidden>
            <div class="panel-times">
              <span data-live="elapsed" id="panelElapsed">00:00.0</span>
              <span id="panelState" class="status-chip" data-state="on">Playing</span>
              <span data-live="remaining" data-prefix="−" id="panelRemaining"></span>
            </div>
          </div>

          <div id="panelScrub" class="panel-scrub" hidden>
            <input id="scrubRange" type="range" min="0" max="100" step="0.1" value="0" aria-label="Position">
            <div class="scrub-labels">
              <span id="scrubValue">0:00.0</span>
              <span id="scrubDuration">0:00.0</span>
            </div>
            <div id="skipButtons" class="skip-buttons">
              <button type="button" class="secondary" data-skip="-10">−10s</button>
              <button type="button" class="secondary" data-skip="-5">−5s</button>
              <button type="button" class="secondary" data-skip="5">+5s</button>
              <button type="button" class="secondary" data-skip="10">+10s</button>
            </div>
          </div>

          <div class="panel-actions">
            <button type="button" id="panelAck" class="light-standby-button" hidden>Standing by</button>
            <button type="button" id="panelStart">Start</button>
            <button type="button" id="panelStartFrom" class="secondary" hidden>Start from here</button>
            <button type="button" id="panelPause" class="secondary" hidden>Pause</button>
            <button type="button" id="panelStop" class="secondary" hidden>Stop</button>
            <button type="button" id="panelStandby" class="secondary">Standby</button>
          </div>
          <p id="panelHint" class="quiet panel-hint"></p>
        </form>
      </dialog>

      <p id="deptToast" class="toast" aria-live="polite"></p>
    </main>
    <script src="/nav.js" defer></script>
    <script src="/dept.js" type="module"></script>
  </body>
</html>
