<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="QLab Connect">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c21"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="go" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.45" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- The Q: a cue-light ring -->
  <circle cx="236" cy="236" r="118" fill="none" stroke="url(#ring)" stroke-width="44"/>
  <!-- Its tail: the GO light -->
  <line x1="300" y1="300" x2="350" y2="350" stroke="url(#ring)" stroke-width="44" stroke-linecap="round"/>
  <circle cx="366" cy="366" r="46" fill="url(#go)"/>
  <!-- Connect: signal waves from the GO light -->
  <path d="M 402 300 A 76 76 0 0 1 432 366" fill="none" stroke="#4ade80" stroke-width="16" stroke-linecap="round" stroke-opacity="0.85"/>
  <path d="M 420 250 A 128 128 0 0 1 468 350" fill="none" stroke="#4ade80" stroke-width="16" stroke-linecap="round" stroke-opacity="0.45"/>
</svg>
