<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QLab Show Report</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell admin-shell">
      <header class="topbar">
        <div class="topbar-title">
          <span class="eyebrow">Show report</span>
          <h1 id="reportTitle">GO log</h1>
        </div>
        <nav class="topnav" aria-label="Pages">
          <a href="/">Monitor</a>
          <a href="/dashboard.html">TV</a>
          <a href="/login.html">Departments</a>
          <a href="/control.html">Control</a>
          <a href="/midi.html">MIDI</a>
          <a href="/report.html" aria-current="page">Report</a>
          <a href="/admin.html">Admin</a>
        </nav>
      </header>

      <section class="status-strip report-summary">
        <div><span class="label">Started</span><strong id="reportStarted">-</strong></div>
        <div><span class="label">Running time</span><strong id="reportRunning">-</strong></div>
        <div><span class="label">Intervals</span><strong id="reportIntervals">-</strong></div>
        <div><span class="label">Cues fired</span><strong id="reportGoCount">0</strong></div>
        <div><span class="label">Stage time</span><strong id="reportStageTime">-</strong></div>
      </section>

      <section class="panel admin-panel">
        <div class="form-actions">
          <a class="tool-button" href="/api/admin/report.csv">Download CSV</a>
          <button id="refreshButton" type="button" class="secondary">Refresh</button>
          <button id="resetButton" type="button" class="secondary">Reset for next show</button>
        </div>
        <div class="report-table-wrap">
          <table class="report-table">
            <thead>
              <tr><th>Time</th><th>Show clock</th><th>Event</th><th>Cue</th><th>Name</th><th>Type</th></tr>
            </thead>
            <tbody id="reportRows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/report.js" type="module"></script>
  </body>
</html>
