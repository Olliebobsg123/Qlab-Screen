<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QLab TV Dashboard</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="tv-body server-offline">
    <main class="tv-shell">
      <section class="tv-status">
        <span id="tvConnection">Disconnected</span>
        <span id="tvWorkspace">-</span>
        <div class="tv-tools">
          <a href="/viewers.html" class="tool-button">Viewers</a>
          <span id="tvWakeStateBadge" class="status-chip">Awake Off</span>
          <span id="tvVersionBadge" class="status-chip version-chip">v0.0.0</span>
          <button id="tvFullscreenButton" type="button" class="tool-button">Fullscreen</button>
          <button id="tvWakeLockButton" type="button" class="tool-button">Keep Awake</button>
        </div>
        <span class="tv-clocks">
          <span id="tvShowClock" class="show-clock" data-state="idle">Show clock</span>
          <span id="tvClock">--:--</span>
        </span>
      </section>

      <section id="tvCurrent" class="tv-current" aria-live="polite">
        <p class="eyebrow">Current cue group</p>
        <h1 id="tvGroup">Waiting for QLab</h1>
        <div class="tv-cue-line">
          <span id="tvCueNumber">-</span>
          <strong id="tvCueName">No cue running</strong>
        </div>
        <div class="tv-progress">
          <span id="tvProgress"></span>
        </div>
        <div class="tv-time">
          <span id="tvElapsed">--:--.- elapsed</span>
          <span id="tvRemaining">--:--.- remaining</span>
        </div>
        <p id="tvCurrentNotes" class="notes-text tv-notes" hidden></p>
        <div id="tvStandby" class="tv-standby">
          <span class="eyebrow">Standby / next GO</span>
          <div class="tv-standby-line">
            <span id="tvStandbyNumber">-</span>
            <strong id="tvStandbyName">-</strong>
          </div>
          <p id="tvStandbyNotes" class="notes-text tv-notes" hidden></p>
        </div>
      </section>

      <section class="tv-next">
        <p class="eyebrow">Running cues</p>
        <div id="tvRunningList">Nothing running.</div>
        <div id="tvMeters" class="tv-meters" hidden aria-label="Audio levels"></div>
      </section>
    </main>

    <script src="/dashboard.js" type="module"></script>
  </body>
</html>
