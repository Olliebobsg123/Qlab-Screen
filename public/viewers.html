<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QLab Screen Viewers</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a0b">
  </head>
  <body>
    <main class="shell admin-shell">
      <header class="topbar">
        <div class="topbar-title">
          <span class="eyebrow">Admin</span>
          <h1>Live viewers</h1>
        </div>
        <nav class="topnav" aria-label="Pages" data-nav></nav>
      </header>

      <section class="panel admin-panel">
        <div class="panel-head">
          <h2>Connected devices</h2>
          <span id="viewerCount">0 live</span>
        </div>
        <div id="viewerList" class="viewer-list empty">No live viewers.</div>
      </section>
    </main>

    <script src="/nav.js" defer></script>

    <script src="/viewers.js" type="module"></script>
  </body>
</html>
